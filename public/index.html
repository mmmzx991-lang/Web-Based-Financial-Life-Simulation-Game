<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#183449" />
    <meta
      name="description"
      content="A bilingual financial life simulation. Work, save, invest and build a life, one month at a time."
    />
    <title>Investment Game</title>
    <link rel="icon" href="/game-world.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a href="#main" id="skip-link" class="skip-link">Skip to content</a>
    <div id="app">
      <main class="loading-screen">
        <span class="brand-mark">↗</span>
        <h1>Investment Game · 投资人生</h1>
        <p>Loading your world… / 正在加载…</p>
      </main>
    </div>
    <dialog id="dialog" aria-label="Investment Game">
      <button
        type="button"
        class="dialog-close"
        id="dialog-close"
        aria-label="Close"
      >
        ×
      </button>
      <div id="dialog-body"></div>
    </dialog>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <noscript
      >This game requires JavaScript. / 此游戏需要启用 JavaScript。</noscript
    >
  </body>
</html>
